{% extends 'base.html' %}
{% block pagetitle %}
Disease Analysis Results
{% endblock pagetitle %}

{% block body %}

<style>
    .falling-leaf {
        position: fixed;
        z-index: 999;
        pointer-events: none;
        animation: falling 10s linear infinite;
    }

    @keyframes falling {
        0% {
            transform: translateY(-10%) rotate(0deg);
            opacity: 1;
        }
        100% {
            transform: translateY(100vh) rotate(360deg);
            opacity: 0;
        }
    }

    .farm-bg {
        background: linear-gradient(135deg, #ffd89b 0%, #ffb366 100%);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        opacity: 0.3;
        background-image: 
            url('data:image/svg+xml;utf8,<svg width="50" height="50" xmlns="http://www.w3.org/2000/svg"><path d="M25 25l12.5-21.7h-25L25 25z" fill="%23D35400" opacity="0.1"/></svg>'),
            url('data:image/svg+xml;utf8,<svg width="30" height="30" xmlns="http://www.w3.org/2000/svg"><circle cx="15" cy="15" r="5" fill="%23E67E22" opacity="0.1"/></svg>');
        animation: bgScroll 30s linear infinite;
    }

    @keyframes bgScroll {
        from { background-position: 0 0, 0 0; }
        to { background-position: 100px 100px, 50px 50px; }
    }

    .result-card {
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.95);
        position: relative;
        overflow: hidden;
        border: 2px solid #D35400;
    }

    .result-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: repeating-linear-gradient(
            45deg,
            #E67E22,
            #E67E22 10px,
            #D35400 10px,
            #D35400 20px
        );
    }

    .result-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(211, 84, 0, 0.15);
    }

    .confidence-bar {
        height: 30px;
        border-radius: 15px;
        background: linear-gradient(90deg, #e74c3c, #f39c12, #27ae60);
        position: relative;
        overflow: hidden;
    }

    .confidence-indicator {
        position: absolute;
        top: 0;
        height: 100%;
        width: 4px;
        background: #2c3e50;
        transition: left 0.5s ease;
    }

    .urgency-high {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        color: white;
    }

    .urgency-medium {
        background: linear-gradient(135deg, #f39c12, #e67e22);
        color: white;
    }

    .urgency-low {
        background: linear-gradient(135deg, #27ae60, #229954);
        color: white;
    }

    .prediction-item {
        padding: 10px;
        margin: 5px 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.8);
        border-left: 4px solid #E67E22;
    }

    .enhanced-prevention {
        background: linear-gradient(135deg, #f8f9fa, #e9ecef);
        border-radius: 15px;
        padding: 20px;
        border: 2px solid #D35400;
    }

    .prevention-step {
        margin: 10px 0;
        padding: 15px;
        background: white;
        border-radius: 8px;
        border-left: 4px solid #27ae60;
        transition: all 0.3s ease;
    }

    .prevention-step:hover {
        transform: translateX(5px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .title-glow {
        animation: titleGlow 2s ease-in-out infinite;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        font-family: 'Rajdhani', sans-serif;
    }

    @keyframes titleGlow {
        0%, 100% { text-shadow: 0 0 5px rgba(211, 84, 0, 0.5); }
        50% { text-shadow: 0 0 20px rgba(211, 84, 0, 0.8); }
    }

    .analysis-badge {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: bold;
        margin: 5px;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    .image-analysis {
        position: relative;
        display: inline-block;
    }

    .analysis-overlay {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(255, 255, 255, 0.9);
        padding: 10px;
        border-radius: 8px;
        font-weight: bold;
        border: 2px solid #D35400;
    }
</style>

<div class="farm-bg"></div>

<script>
    function createLeaf() {
        const leaf = document.createElement('img');
        leaf.src = '/static/images/leaf.png';
        leaf.classList.add('falling-leaf');
        leaf.style.left = Math.random() * 100 + 'vw';
        leaf.style.width = Math.random() * 20 + 20 + 'px';
        leaf.style.filter = 'hue-rotate(' + Math.random() * 90 + 'deg) sepia(50%)';
        document.body.appendChild(leaf);
        
        setTimeout(() => {
            leaf.remove();
        }, 10000);
    }

    setInterval(createLeaf, 2000);
</script>

<div class="container" id="resultsContainer">
    <div class="row mb-5 text-center">
        <div class="col-lg-10 mx-auto">
            <h1 class="display-4 title-glow animate__animated animate__fadeIn" style="padding-top: 2%; font-weight: 400; color: #D35400;">
                <b>🌿 Disease Analysis Results 🌿</b>
            </h1>
            <p class="lead animate__animated animate__fadeIn animate__delay-1s" style="color: #E67E22;">
                AI-Powered Plant Health Diagnosis with Real-Time Recommendations
            </p>
        </div>
    </div>

    <!-- Loading message -->
    <div id="loadingMessage" class="text-center">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
        <p class="mt-3">Loading analysis results...</p>
    </div>

    <!-- Results will be populated here -->
    <div id="analysisResults" style="display: none;">
        <!-- Content will be dynamically inserted here -->
    </div>
</div>

<script>
    // Load analysis results from sessionStorage
    window.addEventListener('load', () => {
        const storedResults = sessionStorage.getItem('analysisResults');
        
        if (storedResults) {
            const diseaseInfo = JSON.parse(storedResults);
            displayResults(diseaseInfo);
        } else {
            // No results found, show message
            document.getElementById('loadingMessage').innerHTML = `
                <div class="alert alert-warning">
                    <h4>No Analysis Results Found</h4>
                    <p>Please upload an image to analyze plant diseases.</p>
                    <a href="/index" class="btn btn-primary">Go to Analysis Page</a>
                </div>
            `;
        }
    });

    function displayResults(data) {
        const resultsContainer = document.getElementById('analysisResults');
        const loadingMessage = document.getElementById('loadingMessage');
        
        // Hide loading, show results
        loadingMessage.style.display = 'none';
        resultsContainer.style.display = 'block';
        
        // Determine urgency class
        let urgencyClass = 'urgency-low';
        if (data.confidence > 0.8) {
            urgencyClass = 'urgency-high';
        } else if (data.confidence > 0.6) {
            urgencyClass = 'urgency-medium';
        }
        
        resultsContainer.innerHTML = `
            <!-- Confidence and Urgency Analysis -->
            <div class="row mb-4">
                <div class="col-lg-12">
                    <div class="result-card p-4 shadow rounded-lg animate__animated animate__fadeIn animate__delay-1s">
                        <h5 class="mb-3">🔍 Analysis Confidence & Urgency</h5>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="confidence-bar mb-2">
                                    <div class="confidence-indicator" style="left: ${(data.confidence * 100) - 2}%"></div>
                                </div>
                                <p><strong>Confidence: ${(data.confidence * 100).toFixed(1)}%</strong></p>
                                <p class="text-muted">${data.analysis_confidence}</p>
                            </div>
                            <div class="col-md-6">
                                <div class="analysis-badge ${urgencyClass}">
                                    ${data.confidence > 0.8 ? '🚨' : data.confidence > 0.6 ? '⚠️' : '✅'} ${data.urgency}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Image Display -->
            <center>
                <div class="col animate__animated animate__fadeIn animate__delay-1s">
                    <div class="result-card p-4 shadow rounded-lg image-analysis" style="width: 30%;">
                        <img src="${data.image_url}" width="350" height="350" class="rounded-lg">
                        <div class="analysis-overlay">
                            ${(data.confidence * 100).toFixed(1)}% Match
                        </div>
                    </div>
                </div>
            </center>
            
            <br>
            
            <!-- Disease Information -->
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="result-card p-5 shadow rounded-lg animate__animated animate__fadeIn animate__delay-2s">
                        <h5 class="text-success mb-4">
                            <b class="animate__animated animate__pulse animate__infinite">
                                🌱 Disease Analysis: ${data.title}
                            </b>
                        </h5>
                        <p style="line-height: 1.8; font-size: 1.1em; color: #333; text-align: justify; padding: 15px; background: rgba(255,255,255,0.7); border-radius: 10px; border-left: 4px solid #E67E22;">
                            ${data.description}
                        </p>
                    </div>
                </div>
            </div>

            <!-- Top 3 Predictions -->
            <div class="row mt-4">
                <div class="col-lg-8 mx-auto">
                    <div class="result-card p-5 shadow rounded-lg animate__animated animate__fadeIn animate__delay-3s">
                        <h5 class="mb-4">🎯 Top 3 Possible Conditions</h5>
                        ${data.top3_predictions.map(pred => `
                            <div class="prediction-item">
                                <strong>${getDiseaseName(pred.class)}</strong>
                                <div class="progress mt-2">
                                    <div class="progress-bar" role="progressbar" style="width: ${pred.probability * 100}%; background: linear-gradient(90deg, #D35400, #E67E22);">
                                        ${(pred.probability * 100).toFixed(1)}%
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>

            <!-- Enhanced Prevention Steps -->
            <div class="row mt-4">
                <div class="col-lg-8 mx-auto">
                    <div class="enhanced-prevention shadow rounded-lg animate__animated animate__fadeIn animate__delay-4s">
                        <h5 class="mb-4">🛡️ Comprehensive Prevention & Treatment Plan</h5>
                        <div class="prevention-step">
                            <div style="white-space: pre-line;">${data.prevention}</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Supplement Recommendation -->
            ${data.supplement_name !== 'Background_without_leaves' ? `
            <div class="row mt-4">
                <div class="col-lg-6 mx-auto">
                    <div class="result-card p-5 shadow rounded-lg animate__animated animate__fadeIn animate__delay-5s">
                        <center>
                            <h5 class="mb-4">
                                <span class="badge" style="background: linear-gradient(45deg, #D35400, #E67E22); padding: 10px 20px; border-radius: 25px;">
                                    🌿 Recommended Treatment
                                </span>
                            </h5>
                            
                            <div class="image-container position-relative" style="margin: 20px 0;">
                                <img src="${data.supplement_image_url}" class="rounded-lg shadow-lg" style="width: 300px; height: 350px; object-fit: cover; border: 3px solid #D35400;">
                            </div>

                            <h6 class="product-name" style="color: #D35400; font-size: 1.2em; font-weight: 600; margin: 15px 0;">
                                ${data.supplement_name}
                            </h6>

                            <a target="_blank" href="${data.supplement_buy_link}" class="text-decoration-none">
                                <button type="button" class="btn btn-success" style="background: linear-gradient(45deg, #D35400, #E67E22); border: none; padding: 12px 30px; border-radius: 50px; font-weight: 600;">
                                    🛒 Purchase Treatment
                                </button>
                            </a>
                        </center>
                    </div>
                </div>
            </div>
            ` : ''}

            <!-- Action Buttons -->
            <div class="row mt-4 mb-5">
                <div class="col-lg-8 mx-auto text-center">
                    <div class="result-card p-4 shadow rounded-lg animate__animated animate__fadeIn animate__delay-6s">
                        <h5>🔄 Next Steps</h5>
                        <div class="mt-3">
                            <a href="/index" class="btn btn-primary mx-2" style="background: linear-gradient(45deg, #D35400, #E67E22); border: none;">
                                📸 Analyze Another Image
                            </a>
                            <a href="/market" class="btn btn-success mx-2" style="background: linear-gradient(45deg, #27ae60, #229954); border: none;">
                                🛍️ Browse Treatments
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function getDiseaseName(classIndex) {
        const diseaseNames = {
            0: 'Apple___Apple_scab',
            1: 'Apple___Black_rot',
            2: 'Apple___Cedar_apple_rust',
            3: 'Apple___healthy',
            4: 'Background_without_leaves',
            5: 'Blueberry___healthy',
            6: 'Cherry___Powdery_mildew',
            7: 'Cherry___healthy',
            8: 'Corn___Cercospora_leaf_spot Gray_leaf_spot',
            9: 'Corn___Common_rust',
            10: 'Corn___Northern_Leaf_Blight',
            11: 'Corn___healthy',
            12: 'Grape___Black_rot',
            13: 'Grape___Esca_(Black_Measles)',
            14: 'Grape___Leaf_blight_(Isariopsis_Leaf_Spot)',
            15: 'Grape___healthy',
            16: 'Orange___Haunglongbing_(Citrus_greening)',
            17: 'Peach___Bacterial_spot',
            18: 'Peach___healthy',
            19: 'Pepper,_bell___Bacterial_spot',
            20: 'Pepper,_bell___healthy',
            21: 'Potato___Early_blight',
            22: 'Potato___Late_blight',
            23: 'Potato___healthy',
            24: 'Raspberry___healthy',
            25: 'Soybean___healthy',
            26: 'Squash___Powdery_mildew',
            27: 'Strawberry___Leaf_scorch',
            28: 'Strawberry___healthy',
            29: 'Tomato___Bacterial_spot',
            30: 'Tomato___Early_blight',
            31: 'Tomato___Late_blight',
            32: 'Tomato___Leaf_Mold',
            33: 'Tomato___Septoria_leaf_spot',
            34: 'Tomato___Spider_mites Two-spotted_spider_mite',
            35: 'Tomato___Target_Spot',
            36: 'Tomato___Tomato_Yellow_Leaf_Curl_Virus',
            37: 'Tomato___Tomato_mosaic_virus',
            38: 'Tomato___healthy'
        };
        return diseaseNames[classIndex] || 'Unknown Disease';
    }
</script>

{% endblock body %}
